<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/styles.css">
<title>Watch Roulette</title></head><body>
<header class="topbar"><h1>Watch Roulette</h1><button id="installBtn" class="icon-btn hidden">⇩</button></header>
<main id="app"></main>
<script>
window.addEventListener("error", function (e) {
  const app = document.getElementById("app");
  if (app) app.innerHTML = '<div style="margin:24px;padding:18px;background:#fff0f0;border:1px solid #e0a0a0;border-radius:14px;font-family:system-ui"><h2 style="margin-top:0">Watch Roulette ha encontrado un error</h2><p><b>' + String(e.message || "Error desconocido") + '</b></p><p style="font-size:13px;color:#666">Línea: ' + String(e.lineno || "?") + '</p></div>';
};
window.addEventListener("unhandledrejection", function (e) {
  const app = document.getElementById("app");
  if (app) app.innerHTML = '<div style="margin:24px;padding:18px;background:#fff0f0;border:1px solid #e0a0a0;border-radius:14px;font-family:system-ui"><h2 style="margin-top:0">Watch Roulette ha encontrado un error</h2><p><b>' + String(e.reason?.message || e.reason || "Promesa rechazada") + '</b></p></div>';
});
</script>
<script src="js/app.js"></script></body></html>
